// Access Control List (ACL)Section
/*

   The ACL mechanism works as follows:

   if allow list exists, then only those requests are allowed
   If deny list exists, always deny the requests from the list

   We need two lists insead of one because: we might want to do this
   allow from 192.168.1
   deny from 192.168.1.1

   This means allow every user on 192.168.1.0 network except 192.168.1.1. No other IP/network is allowed
   Having a single list does not allow us to create such precise ACL

   When ACL_ALLOW FROM is empty, all requests but ACL_DENY_FROM are allowed
   When ACL_DENY_FROM is empty, all requests in ACL_ALLOW_FROM are allowed. If ACL_ALLOW_FROM is empty, all requests allowed.

*/

define('ACL_ALLOW_FROM', '');
define('ACL_DENY_FROM', '130.86,192.168.0.12');
